version: '3.8'

services:
  # MySQL database server
  db:
    image: mysql:8.0
    container_name: safe_travel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: women
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local LLM service for offline/private routing and hotel recommendation analysis
  ollama:
    image: ollama/ollama:latest
    container_name: safe_travel_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Backend Express application (API + Sockets)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safe_travel_backend
    restart: always
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SOCKET_PORT=5001
      - DATABASE_URL=mysql://root:root@db:3306/women
      - JWT_SECRET=production_secret_key_needs_override_in_env
      - ADMIN_JWT_SECRET=production_admin_secret_key_needs_override_in_env
      - UPLOAD_PATH=uploads
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - uploads_data:/usr/src/app/uploads

  # Admin Portal dashboard
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: safe_travel_admin
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  db_data:
  ollama_data:
  uploads_data:
